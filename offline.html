<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Herbora – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #1a3a18 0%, #0f2a0e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 5rem; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #a8d5a2; }
    p  { font-size: 1rem; color: rgba(255,255,255,0.75); max-width: 280px; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      background: #4caf50;
      color: #fff;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn:hover { background: #388e3c; }
    .tip {
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      max-width: 260px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="icon">🌿</div>
  <h1>You're offline</h1>
  <p>No internet connection found. Check your connection and try again.</p>
  <a class="btn" href="./index.html">↺ Try again</a>
  <p class="tip">Herbora saves your favorites and recently viewed remedies so you can access them offline.</p>
</body>
</html>
